name: Add issues to nts-pool project

on:
  pull_request_target:
    types:
      - opened

jobs:
  add-to-project:
    name: Add PR to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          # You can target a project in a different organization
          # to the issue
          project-url: https://github.com/orgs/pendulum-project/projects/6
          github-token: ${{ secrets.PROJECT_WRITE_PAT }}
